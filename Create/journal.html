<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Journal</title>
</head>
<body>
     <h1>Create Journal</h1>
     <!-- Form element -->
     <form action="/api/v1/journal" method="post">
        <!-- label element -->
         <label for="main-title">Journal Title</label>
         <!-- input element -->
        <input id="main-title" type="text" name="title" placeholder="Enter Title" minlength="3" required/>
       
        <br>

        <label for="journal-category"> Journal Category</label>
        <select id="journal-category" name="category" required>
            <option value="task">Task</option>
            <option value="note">Note</option>
            <option value="idea">Idea</option>
            <option value="goal">Goal</option>
            <option value="habit">Habit</option>
            <option value="memory">Memory</option>
            <option value="mood">Mood</option>
            <option value="event">Event</option>
        </select>

        <br>

        <label for="journal-entry"> Journal Entry</label>
        <br>
        <textarea id="journal-entry" name="Entry" rows="5" cols="30" minlength="10" required></textarea>
        <!-- default behaviour of a button is to submit but type is good practice-->
        <br>

        <button type="reset">Reset</button>

        <br>

        <button type="submit">Submit</button>

     </form> 
     
</body>
</html>
