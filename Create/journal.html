<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../style.css">

<title>Journal</title>
</head>

<body>

<h1>Journal</h1>

<form class="journal-form" onsubmit="saveEntry(event)">

<label for="main-title">Journal Title</label>
<input id="main-title" type="text" name="title" placeholder="Enter a title for your entry" minlength="3" required>

<br>

<label for="journal-category">Journal Category</label>
<select id="journal-category" name="category" required>

<option value="">Select a category</option>
<option value="task">Task</option>
<option value="note">Note</option>
<option value="idea">Idea</option>
<option value="goal">Goal</option>
<option value="habit">Habit</option>
<option value="memory">Memory</option>
<option value="mood">Mood</option>
<option value="event">Event</option>

</select>

<br>

<label for="journal-entry">Your Entry</label>

<br>

<textarea id="journal-entry" name="entry" rows="8" cols="40" placeholder="Write your thoughts here..." minlength="10" required></textarea>

<br>


<button type="reset">Clear</button>

<button type="submit">Save Entry</button>


</form>

<div class="btn_space">
    <a href="scrapbook.html" class="button">scrapbook</a>
</div>

<script src="../script.js"></script>

</body>
</html>
